<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Locations</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <header class="bg-gradient-to-r from-slate-800 via-indigo-700 to-slate-700 text-white py-8 shadow-2xl">
      <div class="mx-auto max-w-7xl px-6 lg:px-8 text-center">
        <h1 class="text-4xl font-semibold tracking-wide sm:text-5xl">FILM LOCATIONS</h1>
        <p class="mt-3 text-slate-200 sm:text-lg">Filtrado de locaciones de filmación con mapa y sugerencias en tiempo real.</p>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="grid gap-8 xl:grid-cols-2">
        <section class="rounded-3xl bg-white shadow-2xl overflow-hidden" style="min-height: 760px;">
          <div id="map" class="h-full w-full"></div>
        </section>

        <aside class="rounded-3xl bg-slate-900 bg-opacity-90 p-8 text-slate-100 shadow-2xl">
          <div class="mb-8">
            <p class="text-sm uppercase tracking-wider text-indigo-300">Search panel</p>
            <h2 class="mt-4 text-3xl font-semibold text-white">Buscar por detalles de la película</h2>
            <p class="mt-3 text-slate-400">Usa filtros para encontrar locaciones y ver los marcadores en el mapa.</p>
          </div>

          <div class="space-y-6">
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="title" class="text-sm font-semibold text-slate-200">Title</label>
                <input id="title" name="title" type="text" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20" placeholder="Movie title" />
              </div>
              <div class="space-y-2">
                <label for="optionsTitle" class="text-sm font-semibold text-slate-200">Filter</label>
                <select id="optionsTitle" name="optionsTitle" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20">
                  <option value="is">IS</option>
                  <option value="starts">STARTS WITH</option>
                  <option value="contains">CONTAINS</option>
                </select>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="company" class="text-sm font-semibold text-slate-200">Production Company</label>
                <input id="company" name="company" type="text" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20" placeholder="Company name" />
              </div>
              <div class="space-y-2">
                <label for="optionsCompany" class="text-sm font-semibold text-slate-200">Filter</label>
                <select id="optionsCompany" name="optionsCompany" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20">
                  <option value="is">IS</option>
                  <option value="starts">STARTS WITH</option>
                  <option value="contains">CONTAINS</option>
                </select>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="distributor" class="text-sm font-semibold text-slate-200">Distributor</label>
                <input id="distributor" name="distributor" type="text" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20" placeholder="Distributor" />
              </div>
              <div class="space-y-2">
                <label for="optionsDistributor" class="text-sm font-semibold text-slate-200">Filter</label>
                <select id="optionsDistributor" name="optionsDistributor" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20">
                  <option value="is">IS</option>
                  <option value="starts">STARTS WITH</option>
                  <option value="contains">CONTAINS</option>
                </select>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="director" class="text-sm font-semibold text-slate-200">Director</label>
                <input id="director" name="director" type="text" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20" placeholder="Director" />
              </div>
              <div class="space-y-2">
                <label for="optionsDirector" class="text-sm font-semibold text-slate-200">Filter</label>
                <select id="optionsDirector" name="optionsDirector" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20">
                  <option value="is">IS</option>
                  <option value="starts">STARTS WITH</option>
                  <option value="contains">CONTAINS</option>
                </select>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="writer" class="text-sm font-semibold text-slate-200">Writer</label>
                <input id="writer" name="writer" type="text" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20" placeholder="Writer" />
              </div>
              <div class="space-y-2">
                <label for="optionsWriter" class="text-sm font-semibold text-slate-200">Filter</label>
                <select id="optionsWriter" name="optionsWriter" class="w-full rounded-2xl border border-slate-700 bg-slate-900 bg-opacity-80 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-20">
                  <option value="is">IS</option>
                  <option value="starts">STARTS WITH</option>
                  <option value="contains">CONTAINS</option>
                </select>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div class="space-y-2">
                <label for="minimum" class="text-sm font-semibold text-slate-200">Release Year Min</label>
                <input id="minimum" name="minimum" type="number" min="0" class="w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Min" />
              </div>
              <div class="space-y-2">
                <label for="maximum" class="text-sm font-semibold text-slate-200">Release Year Max</label>
                <input id="maximum" name="maximum" type="number" min="0" class="w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm text-slate-100 placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Max" />
              </div>
            </div>

            <div class="flex flex-wrap gap-4 pt-2">
              <button type="button" class="inline-flex items-center justify-center rounded-2xl bg-indigo-500 px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-indigo-400" onclick="apply()">Apply</button>
              <button type="button" class="inline-flex items-center justify-center rounded-2xl bg-slate-800 px-6 py-3 text-sm font-semibold text-slate-100 transition hover:-translate-y-0.5 hover:bg-slate-700" onclick="clearInputs()">Clear All</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
  <script src="scripts.js"></script>
</body>
</html>
